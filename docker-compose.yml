# Infraestructura local: PostgreSQL y Redis.
# Levantar con: docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: vivero-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USUARIO:-vivero}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-vivero_dev_password}
      POSTGRES_DB: ${DB_NOMBRE:-vivero_db}
    ports:
      - "${DB_PUERTO:-5432}:5432"
    volumes:
      - vivero_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USUARIO:-vivero}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: vivero-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PUERTO:-6379}:6379"
    volumes:
      - vivero_redisdata:/data

  # La API en contenedor (opcional en desarrollo: lo normal es `npm run start:dev` afuera).
  api:
    build: .
    container_name: vivero-api
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
    ports:
      - "${APP_PUERTO:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    profiles: ["full"]

volumes:
  vivero_pgdata:
  vivero_redisdata:
